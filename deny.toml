# cargo-deny policy (CR-003 quality gate). The static check runs licenses/bans/sources offline;
# CI additionally runs advisories against the RustSec database.
[graph]
all-features = true

[advisories]
yanked = "deny"

[licenses]
# Permissive licenses plus MPL-2.0 (file-level copyleft, compatible with distributing the hoh binary).
# Anything else needs a CR-style decision recorded in THIRD_PARTY_NOTICES.md before it is added here.
allow = ["MIT", "Apache-2.0", "Apache-2.0 WITH LLVM-exception", "BSD-2-Clause", "BSD-3-Clause", "ISC", "Unicode-3.0", "Zlib", "MPL-2.0", "CC0-1.0"]
confidence-threshold = 0.9
private = { ignore = true }

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
