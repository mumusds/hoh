[workspace]
resolver = "3"
members = ["crates/hoh-core", "crates/hoh-agents", "crates/hoh-app"]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.99"
license = "MIT"
publish = false

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"
# scripts/product/static.sh compiles the clippy canary of hoh-core with this cfg (AC-062-05).
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(hoh_clippy_canary)"] }

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
