[package]
name = "hoh-app"
description = "HoH composition root: CLI, TUI, HTTP API and host process (binary `hoh`)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lib]
name = "hoh_app"
path = "src/lib.rs"

[[bin]]
name = "hoh"
path = "src/main.rs"

[dependencies]
hoh-core = { path = "../hoh-core" }
hoh-agents = { path = "../hoh-agents" }
ratatui = { version = "0.30.2", default-features = false, features = ["crossterm"] }
axum = { version = "0.8.9", default-features = false, features = ["http1", "json", "query", "tokio"] }
futures-util = { version = "0.3.31", default-features = false, features = ["std"] }
hyper = { version = "1.12.0", features = ["http1", "server"] }
hyper-util = { version = "0.1.21", features = ["tokio", "server", "service", "http1"] }
httparse = "1.10.1"
rustix = { version = "1.1.6", default-features = false, features = ["std", "event", "fs", "process", "rand", "stdio"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
signal-hook = "0.3.18"
nix = { version = "=0.31.3", default-features = false, features = ["signal"] }
unicode-segmentation = "1.13.3"
tokio = { version = "1.53.3", features = ["rt", "rt-multi-thread", "sync", "macros", "net", "time", "io-util", "signal"] }

[lints]
workspace = true

[dev-dependencies]
rustix = { version = "1.1.6", default-features = false, features = ["std", "event", "fs", "process", "pty", "termios"] }
tempfile = "3.27.0"
unicode-width = "0.2.3"
