[package]
name = "hoh-app"
description = "HoH composition root: CLI, TUI, HTTP API and host process (binary `hoh`)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "hoh"
path = "src/main.rs"

[dependencies]
hoh-core = { path = "../hoh-core" }
hoh-agents = { path = "../hoh-agents" }
ratatui = { version = "0.30.2", default-features = false, features = ["crossterm"] }
rustix = { version = "1.1.6", default-features = false, features = ["std", "event", "fs", "process"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
signal-hook = "0.3.18"
unicode-segmentation = "1.13.3"
tokio = { version = "1.53.3", features = ["rt", "sync", "macros"] }

[lints]
workspace = true

[dev-dependencies]
rustix = { version = "1.1.6", default-features = false, features = ["std", "event", "fs", "process", "pty", "termios"] }
tempfile = "3.27.0"
unicode-width = "0.2.3"
