[package]
name = "hoh-core"
description = "HoH domain model: specifications, workflow state, scheduling, verification and persistence ports."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
regex = "1.13.1"
rusqlite = { version = "=0.41.0", features = ["bundled"] }
rustix = { version = "1.1.6", default-features = false, features = ["std", "process", "rand", "time"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
tokio = { version = "1.53.3", features = ["sync", "time", "rt"] }
toml = { version = "1.1.8", default-features = false, features = ["parse", "serde", "std"] }

[dev-dependencies]
proptest = { version = "1.12.0", default-features = false, features = ["std"] }
tempfile = "3.27.0"
tokio = { version = "1.53.3", features = ["macros", "rt"] }
