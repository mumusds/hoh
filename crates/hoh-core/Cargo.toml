[package]
name = "hoh-core"
description = "HoH domain model: specifications, workflow state, scheduling, verification and persistence ports."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
regex = "1.13.1"
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.53.3", features = ["sync", "time", "rt"] }

[dev-dependencies]
tempfile = "3.27.0"
tokio = { version = "1.53.3", features = ["macros", "rt"] }
