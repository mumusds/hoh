[package]
name = "hoh-agents"
description = "HoH native agent adapters (Codex, Claude Code, Pi), protocol framing and process supervision."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
hoh-core = { path = "../hoh-core" }
regex = "1.13.1"
rustix = { version = "1.1.6", default-features = false, features = ["std", "process"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
tokio = { version = "1.53.3", features = ["rt", "net", "io-util", "time", "sync", "macros", "signal"] }

[lints]
workspace = true

[dev-dependencies]
tempfile = "3.27.0"
