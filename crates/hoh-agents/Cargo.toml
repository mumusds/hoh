[package]
name = "hoh-agents"
description = "HoH native agent adapters (Codex, Claude Code, Pi), protocol framing and process supervision."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
hoh-core = { path = "../hoh-core" }
rustix = { version = "1.1.6", default-features = false, features = ["std", "process", "fs"] }
serde = { version = "1.0.229", features = ["derive"] }
# float_roundtrip: schema numbers are parsed correctly rounded, so the probe can tell which read back exactly (M1T07R-39).
serde_json = { version = "1.0.154", features = ["float_roundtrip"] }
sha2 = "0.11.1"
tokio = { version = "1.53.3", features = ["rt", "net", "io-util", "time", "sync", "macros", "signal"] }

[lints]
workspace = true

[dev-dependencies]
tempfile = "3.27.0"
