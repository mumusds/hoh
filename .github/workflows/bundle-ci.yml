name: development-kit-checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  bundle:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      matrix:
        python-version: ['3.11', '3.12', '3.13', '3.14']
    steps:
      # Pinned to reviewed commits (checkout v7.0.1, setup-python v7.1.0).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -r requirements-dev.txt
      - run: shellcheck -S warning scripts/*.sh scripts/product/*.sh scripts/dev/*.sh
      - run: bash scripts/bootstrap.sh --yolo --dry-run
      # The protocol recorder runs every agent CLI in a transient systemd user scope (M0-T06); give the runner user
      # a user manager so tests/bundle/test_record.py exercises that here too (it fails, not skips, under CI).
      - name: Start a systemd user manager
        run: |
          sudo loginctl enable-linger "$USER"
          for _ in $(seq 1 30); do [ -S "/run/user/$(id -u)/bus" ] && break; sleep 1; done
          echo "XDG_RUNTIME_DIR=/run/user/$(id -u)" >> "$GITHUB_ENV"
          echo "DBUS_SESSION_BUS_ADDRESS=unix:path=/run/user/$(id -u)/bus" >> "$GITHUB_ENV"
          XDG_RUNTIME_DIR="/run/user/$(id -u)" systemd-run --user --scope --quiet --collect -- cat /proc/self/cgroup
      # Validation, baseline/CR verification, generated-view drift and all bundle tests.
      - run: bash scripts/check.sh --bundle
      # No native model credentials; these are NOT product/live acceptance tests.
  product:
    # Rust workspace checks (M0-T02). The toolchain is pinned by rust-toolchain.toml.
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - run: rustup toolchain install  # installs the channel and components from rust-toolchain.toml
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      # TEST-006-02 traces hoh doctor's opens with strace (REQ-006: credential files are never opened).
      - run: sudo apt-get update -q && sudo apt-get install -y -q strace
      # The cgroup tracking tests (CR-011, ADR-021 decision 8d v5) run in a delegated scope of the user's systemd
      # manager (systemd-run --user): lingering starts one for the runner user.
      - name: user systemd manager
        run: |
          sudo loginctl enable-linger "$USER"
          runtime="/run/user/$(id -u)"
          for _ in $(seq 1 100); do [ -S "$runtime/systemd/private" ] && break; sleep 0.1; done
          [ -S "$runtime/systemd/private" ]
          echo "XDG_RUNTIME_DIR=$runtime" >> "$GITHUB_ENV"
      - run: cargo test --workspace --locked
      # Dependency policy and RustSec advisories (deny.toml); pinned like scripts/dev/test-infra.sh.
      - run: cargo install --locked cargo-deny@0.20.2
      - run: cargo deny --locked check
