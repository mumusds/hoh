name: development-kit-checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  bundle:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      matrix:
        python-version: ['3.11', '3.12', '3.13']
    steps:
      # Upstream major tags verified in source registry. Pin reviewed SHAs before product release.
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -r requirements-dev.txt
      - run: bash scripts/bootstrap.sh --yolo --dry-run
      - run: bash scripts/check.sh --bundle
      # No native model credentials; these are NOT product/live acceptance tests.
